spring.application.name=motiva

# ===== Banco Oracle FIAP =====
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
# Credenciais vêm de variáveis de ambiente (nunca escreva a senha aqui)
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeno: o banco da FIAP limita o número de sessões por aluno
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=20000

# ===== JPA / Hibernate =====
# As tabelas já existem (scripts da pasta sql/), então o Hibernate não mexe no schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
server.error.include-binding-errors=always

server.port=8080